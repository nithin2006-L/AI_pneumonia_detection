<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pneumonia Detection &amp; Explainability System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>
<body>
    <main class="wrap wrap-center">
        <header class="text-center mb-3">
            <h1>Hybrid Pneumonia Diagnostic Dashboard</h1>
            <p class="muted mb-0">DenseNet-121 + Vision Transformer self-attention + CLAHE preprocessing + Grad-CAM explainability</p>
        </header>

        <div class="card">
            <form action="/predict" method="post" enctype="multipart/form-data" class="dropzone">
                <input id="file-upload" class="visually-hidden" type="file" name="file" accept="image/*" required onchange="updateFileName()">
                <label for="file-upload" class="btn btn-primary">Choose chest X-ray file</label>
                <span id="file-name" class="file-label" aria-live="polite">No file chosen</span>
                <div class="mt-2">
                    <button type="submit" class="btn btn-ok">Analyze scan</button>
                </div>
            </form>

            {% if prediction %}
                <div class="prediction-banner {{ prediction }}" role="status">
                    Diagnostic result: {{ prediction }}
                </div>

                <div class="results">
                    <figure class="scan">
                        <figcaption>Enhanced input X-ray (CLAHE)</figcaption>
                        <img src="{{ url_for('static', filename='uploads/' + original_img) }}" alt="Enhanced input chest X-ray">
                    </figure>
                    <figure class="scan">
                        <figcaption>Grad-CAM attention heatmap</figcaption>
                        <img src="{{ url_for('static', filename='uploads/' + heatmap_img) }}" alt="Grad-CAM attention heatmap">
                    </figure>
                </div>
            {% endif %}
        </div>
    </main>

    <script>
        function updateFileName() {
            var input = document.getElementById('file-upload');
            var fileName = document.getElementById('file-name');
            fileName.textContent = input.files[0] ? input.files[0].name : "No file chosen";
        }
    </script>
</body>
</html>
