<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Clinical Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>
<body>

<main class="wrap wrap-auth wrap-center">
    <div class="auth-head">
        <h1>General Diagnostic Center</h1>
        <p class="muted mb-0">Clinical diagnostic imaging system</p>
    </div>

    <div class="card">
        {% if error %}
            <div class="alert alert-error alert-compact" role="alert">
                <div class="alert-body">{{ error }}</div>
            </div>
        {% endif %}

        {% if success %}
            <div class="alert alert-success alert-compact" role="status">
                <div class="alert-body">{{ success }}</div>
            </div>
        {% endif %}

        <div>
            <div class="tabs tabs-segmented mb-3" role="tablist" aria-label="Account access">
                <button type="button" class="tab" role="tab" id="tab-login" aria-controls="login-tab" aria-selected="true" onclick="showAuthTab('login')">Sign in</button>
                <button type="button" class="tab" role="tab" id="tab-register" aria-controls="register-tab" aria-selected="false" onclick="showAuthTab('register')">New patient</button>
            </div>

            <!-- SIGN IN TAB -->
            <div id="login-tab" role="tabpanel" aria-labelledby="tab-login">
                <form action="/login" method="POST">
                    <div class="field">
                        <label class="label" for="loginEmail">Email address</label>
                        <input type="email" id="loginEmail" name="email" class="input" placeholder="Institutional or personal email" autocomplete="email" required>
                    </div>
                    <div class="field mb-3">
                        <label class="label" for="loginPassword">Password</label>
                        <div class="input-group">
                            <input type="password" id="loginPassword" name="password" class="input" placeholder="Enter password" autocomplete="current-password" required>
                            <button type="button" class="addon" onclick="togglePassword('loginPassword', this)" aria-pressed="false">Show</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
                </form>

                <div class="divider" aria-hidden="true">or</div>

                <div class="stack">
                    <a href="{{ url_for('google_login') }}">Sign in with Google</a>
                    <a href="{{ url_for('facebook_login') }}">Sign in with Facebook</a>
                </div>
            </div>

            <!-- REGISTER TAB -->
            <div id="register-tab" role="tabpanel" aria-labelledby="tab-register" hidden>
                <form action="/register" method="POST">
                    <div class="field">
                        <label class="label" for="regName">Full name</label>
                        <input type="text" id="regName" name="name" class="input" placeholder="Full name" autocomplete="name" required>
                    </div>
                    <div class="field">
                        <label class="label" for="regEmail">Email address</label>
                        <input type="email" id="regEmail" name="email" class="input" placeholder="patient@mail.com" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label class="label" for="patientTypeSelect">Account registration type</label>
                        <select name="patient_type" id="patientTypeSelect" class="select" onchange="toggleDoctorField()">
                            <option value="PUBLIC">Public patient (self evaluation)</option>
                            <option value="PRIVATE_HOSPITAL">Private hospital patient (attending physician linked)</option>
                        </select>
                    </div>

                    <div class="field" id="doctorSelectGroup" hidden>
                        <label class="label" for="attendingDoctor">Attending physician</label>
                        <select name="attending_doctor" id="attendingDoctor" class="select">
                            <option value="Unassigned">-- Select attending doctor --</option>
                            {% for doc in doctors %}
                                <option value="{{ doc['name'] }}">{{ doc['name'] }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="field mb-3">
                        <label class="label" for="regPassword">Create password</label>
                        <div class="input-group">
                            <input type="password" id="regPassword" name="password" class="input" placeholder="Password" autocomplete="new-password" required>
                            <button type="button" class="addon" onclick="togglePassword('regPassword', this)" aria-pressed="false">Show</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-ok btn-block">Create patient account</button>
                </form>
            </div>
        </div>
    </div>
</main>

<script>
    function togglePassword(inputId, btn) {
        var input = document.getElementById(inputId);
        if (!input) return;
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? 'Hide' : 'Show';
        btn.setAttribute('aria-pressed', show ? 'true' : 'false');
    }

    function showAuthTab(name) {
        ['login', 'register'].forEach(function (n) {
            var on = (n === name);
            document.getElementById(n + '-tab').hidden = !on;
            var tab = document.getElementById('tab-' + n);
            tab.setAttribute('aria-selected', on ? 'true' : 'false');
        });
    }

    function toggleDoctorField() {
        var patientType = document.getElementById('patientTypeSelect').value;
        document.getElementById('doctorSelectGroup').hidden = (patientType !== 'PRIVATE_HOSPITAL');
    }
</script>
</body>
</html>
